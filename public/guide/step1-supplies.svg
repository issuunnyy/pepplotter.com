<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(51, 65, 85, 0.25)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Ambient light -->
  <circle cx="400" cy="225" r="180" fill="url(#glow-teal)" filter="blur(60px)" />

  <!-- Clean Table Surface Indicator -->
  <line x1="60" y1="340" x2="740" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
  <text x="740" y="360" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CLEAN, FLAT SURFACE</text>

  <!-- Item 1: Peptide Vial -->
  <g transform="translate(110, 160)">
    <rect x="0" y="30" width="60" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <rect x="10" y="70" width="40" height="60" fill="#0284c7" opacity="0.4" />
    <rect x="18" y="15" width="24" height="15" fill="#38bdf8" />
    <rect x="10" y="0" width="40" height="15" rx="3" fill="#0ea5e9" />
    <text x="30" y="100" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">PEPTIDE</text>
    <text x="30" y="170" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. Peptide Vial</text>
    <text x="30" y="188" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Warm to room temp</text>
  </g>

  <!-- Item 2: Insulin Syringe -->
  <g transform="translate(280, 140)">
    <!-- Syringe Body -->
    <line x1="30" y1="0" x2="30" y2="45" stroke="#f8fafc" stroke-width="2" />
    <rect x="22" y="45" width="16" height="12" rx="2" fill="#f97316" />
    <rect x="16" y="57" width="28" height="95" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Ticks -->
    <line x1="22" y1="75" x2="30" y2="75" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="22" y1="95" x2="34" y2="95" stroke="#34d399" stroke-width="2" />
    <line x1="22" y1="115" x2="30" y2="115" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="22" y1="135" x2="30" y2="135" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Flange & Plunger -->
    <rect x="6" y="152" width="48" height="6" rx="2" fill="#cbd5e1" />
    <rect x="27" y="158" width="6" height="24" fill="#94a3b8" />
    <rect x="14" y="182" width="32" height="6" rx="2" fill="#cbd5e1" />
    <text x="30" y="210" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. 31G Syringe</text>
    <text x="30" y="228" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sterile single-use</text>
  </g>

  <!-- Item 3: Alcohol Wipes -->
  <g transform="translate(470, 195)">
    <rect x="0" y="0" width="75" height="75" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
    <rect x="12" y="12" width="50" height="50" rx="4" fill="#34d399" opacity="0.3" />
    <text x="37" y="44" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="16" font-weight="900">70%</text>
    <text x="37" y="115" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. Alcohol Pads</text>
    <text x="37" y="133" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Two separate pads</text>
  </g>

  <!-- Item 4: Sharps Bin -->
  <g transform="translate(630, 160)">
    <rect x="0" y="20" width="70" height="100" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2.5" />
    <rect x="10" y="0" width="50" height="20" rx="4" fill="#ef4444" />
    <circle cx="35" cy="55" r="14" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5" />
    <text x="35" y="60" text-anchor="middle" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">☣</text>
    <text x="35" y="90" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="bold">SHARPS</text>
    <text x="35" y="150" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">4. Sharps Bin</text>
    <text x="35" y="168" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Puncture-resistant</text>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="30" width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="56" cy="45" r="5" fill="#10b981" />
  <text x="70" y="50" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STEP 1 • Aseptic Setup</text>
</svg>
