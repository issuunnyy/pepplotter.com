<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(51, 65, 85, 0.2)" stroke-width="1">
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="400" y1="0" x2="400" y2="450" />
  </g>

  <!-- Left: 10-Second Dwell Count -->
  <g transform="translate(60, 60)">
    <text x="140" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">1. Hold Still for 10 Seconds</text>
    <text x="140" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Allows dense peptide solution to disperse</text>

    <!-- Timer Ring Graphic -->
    <g transform="translate(140, 160)">
      <circle cx="0" cy="0" r="55" fill="#0b1322" stroke="#334155" stroke-width="6" />
      <circle cx="0" cy="0" r="55" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="345" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90)" />
      <text x="0" y="10" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="32" font-weight="bold">10s</text>
      <text x="0" y="30" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">DWELL TIME</text>
    </g>

    <!-- Anti-Leak Note -->
    <rect x="20" y="250" width="240" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="140" y="275" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Zero Medication Backflow</text>
    <text x="140" y="320" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🚫 NEVER massage or rub the spot</text>
  </g>

  <!-- Divider -->
  <line x1="400" y1="70" x2="400" y2="380" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Right: Biohazard Sharps Disposal & Cold Chain -->
  <g transform="translate(460, 60)">
    <text x="140" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">2. Biohazard Safe Disposal</text>
    <text x="140" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Drop immediately into puncture-proof bin</text>

    <!-- Sharps Disposal Container Graphic -->
    <g transform="translate(100, 95)">
      <rect x="0" y="25" width="80" height="110" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5" />
      <rect x="15" y="0" width="50" height="25" rx="5" fill="#ef4444" />
      <rect x="25" y="8" width="30" height="8" rx="2" fill="#450a0a" />
      <!-- Needle dropping in slot -->
      <line x1="40" y1="-25" x2="40" y2="12" stroke="#f8fafc" stroke-width="2" />
      <rect x="36" y="-35" width="8" height="12" fill="#f97316" />
      <!-- Biohazard symbol -->
      <circle cx="40" cy="70" r="16" fill="#991b1b" stroke="#fca5a5" stroke-width="1.5" />
      <text x="40" y="75" text-anchor="middle" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">☣</text>
      <text x="40" y="105" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="bold">SHARPS</text>
    </g>

    <!-- Cold Chain Box -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="280" height="70" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">❄ Reconstituted Storage: 2°C–8°C</text>
      <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Refrigerate reconstituted peptides. Protect from light &amp; vigorous shaking.</text>
    </g>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="30" width="200" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="56" cy="45" r="5" fill="#10b981" />
  <text x="70" y="50" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STEP 5 • Dwell &amp; Disposal</text>
</svg>
