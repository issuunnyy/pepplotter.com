<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(51, 65, 85, 0.2)" stroke-width="1">
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="266" y1="0" x2="266" y2="450" />
    <line x1="533" y1="0" x2="533" y2="450" />
  </g>

  <!-- Left Part: Inject Equal Volume of Air -->
  <g transform="translate(60, 60)">
    <text x="90" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">1. Inject Equal Air</text>
    <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Prevents vacuum fight</text>

    <!-- Upright vial -->
    <g transform="translate(60, 150)">
      <rect x="0" y="25" width="60" height="85" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
      <rect x="8" y="55" width="44" height="45" fill="#0284c7" opacity="0.35" />
      <rect x="18" y="10" width="24" height="15" fill="#64748b" />
      <rect x="10" y="0" width="40" height="12" rx="3" fill="#38bdf8" />
    </g>

    <!-- Syringe above pumping air down -->
    <g transform="translate(75, 75)">
      <line x1="15" y1="0" x2="15" y2="75" stroke="#f8fafc" stroke-width="2" />
      <rect x="5" y="0" width="20" height="45" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <!-- Air Arrow -->
      <path d="M15,25 L15,65" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2" />
      <polygon points="15,72 10,62 20,62" fill="#38bdf8" />
      <text x="35" y="45" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold">AIR ↓</text>
    </g>
  </g>

  <!-- Middle Part: Inverted Vial & Submerged Needle -->
  <g transform="translate(310, 60)">
    <text x="90" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">2. Invert &amp; Submerge</text>
    <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fluid covers needle tip</text>

    <!-- Inverted vial -->
    <g transform="translate(60, 80)">
      <rect x="10" y="90" width="40" height="12" rx="3" fill="#38bdf8" />
      <rect x="18" y="77" width="24" height="15" fill="#64748b" />
      <rect x="0" y="0" width="60" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Liquid pooling against stopper at bottom -->
      <rect x="8" y="30" width="44" height="47" fill="#0284c7" opacity="0.6" />
      <!-- Needle penetrating stopper into liquid -->
      <line x1="30" y1="130" x2="30" y2="45" stroke="#f8fafc" stroke-width="2" />
    </g>

    <!-- Syringe body below -->
    <g transform="translate(75, 200)">
      <rect x="5" y="0" width="20" height="60" rx="3" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <rect x="7" y="0" width="16" height="35" fill="#10b981" opacity="0.75" />
      <rect x="4" y="35" width="22" height="6" fill="#059669" />
      <rect x="12" y="41" width="6" height="30" fill="#94a3b8" />
      <rect x="3" y="71" width="24" height="5" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Right Part: Flick & Align Precision Loupe -->
  <g transform="translate(560, 60)">
    <text x="90" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">3. Tap &amp; Align Mark</text>
    <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Flick bubbles, lock target</text>

    <!-- Big Zoom Loupe -->
    <circle cx="90" cy="190" r="85" fill="#0b1322" stroke="#10b981" stroke-width="3" />
    <line x1="150" y1="250" x2="190" y2="290" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

    <!-- Zoomed Syringe Ticks inside Loupe -->
    <g transform="translate(70, 125)">
      <rect x="0" y="0" width="40" height="125" rx="4" fill="#020617" stroke="#64748b" stroke-width="2" />
      <!-- Liquid fill -->
      <rect x="2" y="0" width="36" height="70" fill="#10b981" opacity="0.85" />
      <!-- Black seal exactly at mark -->
      <rect x="0" y="68" width="40" height="8" fill="#059669" />

      <!-- Graduation lines -->
      <line x1="2" y1="20" x2="14" y2="20" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="2" y1="45" x2="14" y2="45" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Target mark line -->
      <line x1="-15" y1="70" x2="45" y2="70" stroke="#34d399" stroke-width="2.5" />
      <text x="-20" y="74" text-anchor="end" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Dose</text>

      <line x1="2" y1="95" x2="14" y2="95" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Rising micro bubbles -->
      <circle cx="20" cy="30" r="2.5" fill="#ffffff" opacity="0.8" />
      <circle cx="28" cy="18" r="2" fill="#ffffff" opacity="0.8" />
    </g>

    <text x="90" y="305" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">✓ Plunger on Exact Line</text>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="30" width="200" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="56" cy="45" r="5" fill="#10b981" />
  <text x="70" y="50" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STEP 3 • Vacuum &amp; Draw</text>
</svg>
