<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(51, 65, 85, 0.2)" stroke-width="1">
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="400" y1="0" x2="400" y2="450" />
  </g>

  <!-- Left: Pinch-up Technique & 3-Layer Cross-Section -->
  <g transform="translate(60, 60)">
    <text x="140" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Subcutaneous Target: Fat Layer</text>
    <text x="140" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Needle stops cleanly in soft adipose tissue</text>

    <!-- 3 Layer Stack with Pinched Mound -->
    <g transform="translate(10, 130)">
      <!-- Skin Fold (Pinched Mound) -->
      <path d="M0,40 Q130,-15 260,40 L260,65 Q130,10 0,65 Z" fill="#fed7aa" />
      <text x="20" y="50" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Skin Layer</text>

      <!-- Fat Layer (Target) -->
      <path d="M0,65 Q130,10 260,65 L260,145 Q130,90 0,145 Z" fill="#fef08a" />
      <text x="20" y="105" fill="#854d0e" font-family="system-ui, sans-serif" font-size="13" font-weight="900">Sub-Q Fat (Target Zone)</text>

      <!-- Muscle Layer (Deep) -->
      <rect x="0" y="145" width="260" height="45" rx="4" fill="#991b1b" />
      <text x="20" y="172" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Muscle Layer (Avoid)</text>

      <!-- Pinching Finger Indicators -->
      <path d="M-15,35 L10,35" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)" />
      <path d="M275,35 L250,35" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)" />
      <text x="130" y="215" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Gentle Pinch with Non-Dominant Hand</text>
    </g>

    <!-- 90 Degree Syringe inserting into the pinch -->
    <g transform="translate(140, 75)">
      <!-- Needle penetrating into fat -->
      <line x1="0" y1="0" x2="0" y2="105" stroke="#f8fafc" stroke-width="2.5" />
      <!-- Green absorption target halo -->
      <circle cx="0" cy="105" r="8" fill="#10b981" opacity="0.6" />
      <circle cx="0" cy="105" r="16" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" />

      <!-- Hub & Syringe Barrel -->
      <rect x="-8" y="-20" width="16" height="20" rx="3" fill="#f97316" />
      <rect x="-14" y="-105" width="28" height="85" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5" />
      <!-- Plunger Depressed -->
      <rect x="-12" y="-30" width="24" height="6" fill="#059669" />
      <rect x="-3" y="-85" width="6" height="55" fill="#94a3b8" />
      <rect x="-16" y="-88" width="32" height="6" rx="2" fill="#cbd5e1" />

      <!-- 90 Angle Arc -->
      <path d="M15,-5 A20,20 0 0,1 25,15" fill="none" stroke="#38bdf8" stroke-width="2" />
      <text x="32" y="5" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">90°</text>
    </g>
  </g>

  <!-- Right: Clinical Rules Callouts -->
  <g transform="translate(450, 90)">
    <!-- Strict No Aspiration Warning Box -->
    <rect x="0" y="0" width="290" height="95" rx="14" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="25" y="32" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="15" font-weight="900">🚫 STRICTLY NO ASPIRATION</text>
    <text x="25" y="56" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Do NOT pull plunger back to check blood!</text>
    <text x="25" y="74" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11">Sub-Q has no major vessels. Pulling wobbles needle and causes severe bruising.</text>

    <!-- Smooth Dart Technique Box -->
    <rect x="0" y="115" width="290" height="95" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="25" y="147" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="15" font-weight="900">✅ DART-LIKE QUICK ENTRY</text>
    <text x="25" y="171" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Hold like a pen, insert smoothly</text>
    <text x="25" y="190" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Push plunger evenly. Pain receptor density in Sub-Q is ultra-low.</text>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="30" width="200" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="56" cy="45" r="5" fill="#10b981" />
  <text x="70" y="50" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STEP 4 • 90° Dart Injection</text>
</svg>
